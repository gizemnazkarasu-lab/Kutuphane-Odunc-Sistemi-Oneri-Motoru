<!DOCTYPE html>

<div id="app"></div>

<script>
const STORAGE_KEY = 'kutuphane_json_db_v2';

function fmtDate(d) {
    const dt = (d instanceof Date) ? d : new Date(d);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(dt.getDate())}.${pad(dt.getMonth()+1)}.${dt.getFullYear()}`;
}
function fmtDateTime(d) {
    const dt = (d instanceof Date) ? d : new Date(d);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(dt.getDate())}.${pad(dt.getMonth()+1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function addDays(d, days) {
    const dt = new Date((d instanceof Date) ? d.getTime() : new Date(d).getTime());
    dt.setDate(dt.getDate() + days);
    return dt;
}
function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

}

let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || getDefaultData();
let state = {
    route: 'catalog',
    params: {},
    flashSuccess: null,
    flashError: null
};

function saveDb() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}
function nextId(arr) {
    return arr.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1;
}
function navigate(route, params = {}, success = null, error = null) {
    state.route = route;
    state.params = params;
    state.flashSuccess = success;
    state.flashError = error;
    render();
    window.scrollTo(0, 0);
}

function getCurrentUser() {
    return db.users.find(u => u.id === db.currentUserId && u.active) || null;
}
function getBookAuthors(book) {
    return (book.authorIds || []).map(id => db.authors.find(a => a.id === id)?.name).filter(Boolean).join(', ') || 'Bilinmeyen Yazar';
}
function getCategoryName(catId) {
    return db.categories.find(c => c.id === catId)?.name || 'Genel';
}
function getAvailableCopies(bookId) {
    return db.copies.filter(c => c.bookId === bookId && c.status === 'available');
}
function getRecommendations(bookId) {
    const copyToBook = {};
    db.copies.forEach(c => copyToBook[c.id] = c.bookId);
    const userBooks = {};
    db.loans.forEach(l => {
        const bId = copyToBook[l.copyId];
        if (!bId) return;
        userBooks[l.userId] = userBooks[l.userId] || {};
        userBooks[l.userId][bId] = true;
    });
    const counts = {};
    Object.values(userBooks).forEach(bMap => {
        if (!bMap[bookId]) return;
        Object.keys(bMap).forEach(otherId => {
            const oid = Number(otherId);
            if (oid !== bookId) counts[oid] = (counts[oid] || 0) + 1;
        });
    });
    return Object.entries(counts)
        .sort((a,b) => b[1] - a[1] || Number(a[0]) - Number(b[0]))
        .map(([bid, cnt]) => {
            const b = db.books.find(x => x.id === Number(bid));
            return b ? { book: b, authors: getBookAuthors(b), sharedReaderCount: cnt } : null;
        }).filter(Boolean);
}

function allocateNextForCopy(copyId, now = new Date()) {
    const copy = db.copies.find(c => c.id === copyId);
    if (!copy) return null;
    const waiting = db.reservations
        .filter(r => r.bookId === copy.bookId && r.status === 'waiting')
        .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt) || a.id - b.id);
    if (waiting.length === 0) {
        copy.status = 'available';
        saveDb();
        return null;
    }
    const nextRes = waiting[0];
    const exp = addDays(now, db.settings.reservationHoldDays || 3);
    nextRes.status = 'allocated';
    nextRes.allocatedCopyId = copy.id;
    nextRes.allocatedAt = now.toISOString();
    nextRes.expiresAt = exp.toISOString();
    copy.status = 'allocated';

    const book = db.books.find(b => b.id === copy.bookId);
    const msg = `Rezervasyon sıranız geldi! "${book ? book.title : 'Kitap'}" (${copy.inventoryCode}) kitabının kopyası 3 gün süreyle (${fmtDateTime(exp)} tarihine kadar) sizin için ayrıldı.`;
    db.notifications.push({
        id: nextId(db.notifications),
        userId: nextRes.userId,
        reservationId: nextRes.id,
        message: msg,
        createdAt: now.toISOString(),
        readAt: null
    });
    saveDb();
    return nextRes;
}

function render() {
    const user = getCurrentUser();
    const unreadCount = user ? db.notifications.filter(n => n.userId === user.id && !n.readAt).length : 0;

    let pageTitle = 'Kitap Kataloğu';
    let bodyHtml = '';

    if (!user && state.route !== 'register') {
        state.route = 'login';
    }

    if (state.route === 'login') {

            <a onclick="navigate('catalog')" class="brand-logo">kütüphane &amp; öneri</a>
            <span class="brand-sub">Ödünç Sistemi ve Öneri Motoru</span>
        </div>
        ${user ? `
            <nav class="main-nav">
                <a onclick="navigate('catalog')">katalog</a>
                <a onclick="navigate('my-loans')">ödünçlerim</a>
                <a onclick="navigate('my-reservations')">rezervasyonlarım</a>
                <a onclick="navigate('my-fines')">cezalarım</a>
                <a onclick="navigate('notifications')">
                    bildirimlerim
                    ${unreadCount > 0 ? `<span class="notif-count">${unreadCount}</span>` : ''}
                </a>
                ${['librarian','admin'].includes(user.role) ? `
                    <a class="staff-link" onclick="navigate('librarian-loans')">ödünç &amp; iade</a>
                    <a class="staff-link" onclick="navigate('librarian-reservations')">rezervasyon sırası</a>
                ` : ''}
            </nav>
            <div class="header-user">
                <span><strong>${esc(user.name)}</strong> (${esc(user.memberNumber)})</span>
                <a onclick="logoutUser()" class="btn" style="padding: 5px 14px; font-size: 12px;">çıkış</a>
            </div>
        ` : `
            <nav class="main-nav">
                <a onclick="navigate('login')">giriş yap</a>
                <a onclick="navigate('register')">kaydol</a>
            </nav>
        `}
    </header>

    <div class="trim-border"></div>

    <div class="striped-stage">
        <main class="cream-sheet">
            <div class="sheet-header">
                <h1 class="sheet-title">${esc(pageTitle)}</h1>
                <div class="sheet-meta">
                    ${user ? `${user.role === 'librarian' ? 'Kütüphane Görevlisi' : (user.role === 'admin' ? 'Sistem Yöneticisi' : 'Üye Paneli')} &mdash; ${esc(user.memberNumber)}` : 'Kullanıcı Oturumu'}
                </div>
            </div>
            ${state.flashSuccess ? `<div class="alert alert-success">${esc(state.flashSuccess)}</div>` : ''}
            ${state.flashError ? `<div class="alert alert-error">Hata alanı: ${esc(state.flashError)}</div>` : ''}
            ${bodyHtml}
        </main>
    </div>`;

    document.getElementById('app').innerHTML = html;
}

window.switchUser = function(id) {
    db.currentUserId = id;
    saveDb();
    const u = getCurrentUser();
    navigate(u && u.role === 'librarian' ? 'librarian-loans' : 'catalog', {}, `Aktif hesap değiştirildi: ${u.name} (${u.memberNumber})`);
};
window.logoutUser = function() {
    db.currentUserId = null;
    saveDb();
    navigate('login', {}, 'Oturumunuz güvenli bir şekilde sonlandırıldı.');
};
window.handleLogin = function(e) {
    e.preventDefault();
    const cred = document.getElementById('login_cred').value.trim().toLowerCase();
    const pass = document.getElementById('login_pass').value;
    const u = db.users.find(x =>
        x.email.toLowerCase() === cred ||
        x.email.split('@')[0].toLowerCase() === cred ||
        x.memberNumber.toLowerCase() === cred ||
        x.name.toLowerCase() === cred ||
        x.name.toLowerCase().startsWith(cred)
    );
    if (!u || !pass) {
        navigate('login', {}, null, 'Kullanıcı adı veya şifre hatalı.');
        return;
    }
    db.currentUserId = u.id;
    saveDb();
    navigate('catalog', {}, `Hoş geldiniz, ${u.name} (${u.memberNumber}). Giriş başarılı.`);
};
window.handleRegister = function(e) {
    e.preventDefault();
    const name = document.getElementById('reg_name').value.trim();
    const email = document.getElementById('reg_email').value.trim();
    const pass = document.getElementById('reg_pass').value;
    if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        navigate('register', {}, null, 'Bu e-posta adresi ile kayıtlı bir üye zaten mevcut.');
        return;
    }
    const id = nextId(db.users);
    const memberNumber = 'UYE-' + String(id).padStart(4, '0');
    const newUser = { id, name, email, password: pass, role: 'member', active: true, memberNumber };
    db.users.push(newUser);
    db.currentUserId = id;
    saveDb();
    navigate('catalog', {}, `Kaydınız tamamlandı, ${name}. Kendi hesabınızla giriş yapıldı (Üye No: ${memberNumber}).`);
};
window.handleCatalogSearch = function(e) {
    e.preventDefault();
    navigate('catalog', {
        q: document.getElementById('cat_q').value,
        categoryId: Number(document.getElementById('cat_id').value)
    });
};
window.borrowCopy = function(userId, copyId, returnRoute, params = {}) {
    const activeCount = db.loans.filter(l => l.userId === userId && !l.returnedAt).length;
    if (activeCount >= 5) {
        navigate(returnRoute, params, null, 'Ödünç limiti aşıldı! Bir üye aynı anda en fazla 5 aktif kitap ödünç alabilir.');
        return;
    }
    const copy = db.copies.find(c => c.id === copyId);
    if (!copy || copy.status === 'loaned') {
        navigate(returnRoute, params, null, 'Bu kitap kopyası şu anda başka bir üyede ödünçtedir.');
        return;
    }
    const alloc = db.reservations.find(r => r.allocatedCopyId === copyId && r.status === 'allocated');
    if (alloc) {
        if (alloc.userId !== userId) {
            navigate(returnRoute, params, null, 'Bu kopya rezervasyon sırasındaki başka bir üyeye ayrılmıştır.');
            return;
        }
        alloc.status = 'completed';
    }
    const now = new Date();
    const due = addDays(now, 14);
    db.loans.push({
        id: nextId(db.loans),
        userId,
        copyId,
        borrowedAt: now.toISOString(),
        dueAt: due.toISOString(),
        returnedAt: null,
        renewalCount: 0
    });
    copy.status = 'loaned';
    saveDb();
    const book = db.books.find(b => b.id === copy.bookId);
    navigate(returnRoute, params, `Ödünç işlemi tamamlandı! '${book ? book.title : 'Kitap'}' (${copy.inventoryCode}) kaydedildi. Son teslim tarihi: ${fmtDate(due)}.`);
};
window.joinReservationQueue = function(bookId) {
    const user = getCurrentUser();
    const existing = db.reservations.find(r => r.userId === user.id && r.bookId === bookId && ['waiting','allocated'].includes(r.status));
    if (existing) {
        navigate('book-detail', {id: bookId}, null, 'Bu kitap için zaten aktif bir rezervasyonunuz bulunmaktadır.');
        return;
    }
    const res = {
        id: nextId(db.reservations),
        userId: user.id,
        bookId,
        allocatedCopyId: null,
        createdAt: new Date().toISOString(),
        allocatedAt: null,
        expiresAt: null,
        status: 'waiting'
    };
    db.reservations.push(res);
    saveDb();
    const q = db.reservations.filter(r => r.bookId === bookId && ['waiting','allocated'].includes(r.status));
    navigate('book-detail', {id: bookId}, `Rezervasyon sırasına eklendiniz! Rezervasyon sıranız: ${q.length}. Kitap iade edildiğinde 3 gün süreyle adınıza ayrılacak ve bildirim alacaksınız.`);
};
window.cancelReservation = function(resId, returnRoute) {
    const r = db.reservations.find(x => x.id === resId);
    if (!r) return;
    const copyId = r.allocatedCopyId;
    r.status = 'cancelled';
    r.allocatedCopyId = null;
    if (copyId) allocateNextForCopy(copyId);
    saveDb();
    navigate(returnRoute, {}, 'Rezervasyon kaydınız iptal edildi.');
};
window.renewLoan = function(loanId) {
    const l = db.loans.find(x => x.id === loanId);
    if (!l || l.renewalCount >= 1) {
        navigate('my-loans', {}, null, 'Bu kitap için uzatma hakkı kullanılmış.');
        return;
    }
    l.dueAt = addDays(new Date(l.dueAt), 14).toISOString();
    l.renewalCount++;
    saveDb();
    navigate('my-loans', {}, `Ödünç süresi 14 gün uzatıldı! Yeni teslim tarihi: ${fmtDate(l.dueAt)} (Uzatma hakkı: 1 / 1).`);
};
window.returnLoan = function(loanId, simulateDaysLate, returnRoute) {
    const l = db.loans.find(x => x.id === loanId);
    if (!l || l.returnedAt) return;
    const now = simulateDaysLate > 0 ? addDays(new Date(l.dueAt), simulateDaysLate) : new Date();
    l.returnedAt = now.toISOString();
    const daysLate = Math.max(0, Math.floor((now - new Date(l.dueAt)) / 86400000));
    const fineKurus = Math.min(10000, daysLate * 500);
    if (fineKurus > 0) {
        db.fines.push({ id: nextId(db.fines), loanId: l.id, amountInKurus: fineKurus, calculatedAt: now.toISOString() });
    }
    const allocRes = allocateNextForCopy(l.copyId, now);
    saveDb();
    let msg = `Kitap iadesi başarıyla kaydedildi. Gecikme Cezası: ${(fineKurus/100).toFixed(2).replace('.',',')} TL.`;
    if (allocRes) {
        const u = db.users.find(x => x.id === allocRes.userId);
        msg += ` Rezervasyon sırasındaki ilk uygun üye (${u ? u.name : 'Üye'}) için kopya 3 gün süreyle ayrıldı ve sistem içi bildirim gönderildi!`;
    } else {
        msg += ` Bekleyen rezervasyon olmadığı için kopya 'Müsait' durumuna geçirildi.`;
    }
    navigate(returnRoute, {}, msg);
};
window.resetAllDemoData = function() {
    localStorage.removeItem(STORAGE_KEY);
    db = getDefaultData();
    saveDb();
    navigate('catalog', {}, 'Tüm JSON verileri ilk sunum başlangıç durumuna sıfırlandı.');
};

render();
</script>
</body>
</html>
